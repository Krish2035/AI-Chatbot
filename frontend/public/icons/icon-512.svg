<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="url(#glow)" stroke-width="8" />
  
  <!-- Center Glowing Brain / Circuit Shape -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Outer Aura Ring -->
    <circle cx="150" cy="150" r="130" fill="none" stroke="url(#glow)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />
    <circle cx="150" cy="150" r="105" fill="none" stroke="url(#innerGlow)" stroke-width="2" opacity="0.4" />
    
    <!-- Brain & Neural Nodes -->
    <path d="M150 50 C110 50 80 80 80 120 C60 135 50 165 50 190 C50 230 80 250 110 250 C130 250 145 240 150 230 C155 240 170 250 190 250 C220 250 250 230 250 190 C250 165 240 135 220 120 C220 80 190 50 150 50 Z" 
          fill="url(#glow)" opacity="0.85" />
    
    <!-- Neural Circuit Lines -->
    <path d="M150 70 L150 220 M110 110 L150 140 L190 110 M90 170 L150 170 L210 170 M120 210 L150 185 L180 210" 
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Glowing Node Dots -->
    <circle cx="150" cy="70" r="9" fill="#38bdf8" />
    <circle cx="110" cy="110" r="8" fill="#a855f7" />
    <circle cx="190" cy="110" r="8" fill="#a855f7" />
    <circle cx="90" cy="170" r="8" fill="#06b6d4" />
    <circle cx="210" cy="170" r="8" fill="#06b6d4" />
    <circle cx="150" cy="140" r="10" fill="#ffffff" />
    <circle cx="150" cy="170" r="11" fill="#38bdf8" />
    <circle cx="120" cy="210" r="8" fill="#c084fc" />
    <circle cx="180" cy="210" r="8" fill="#c084fc" />
  </g>
</svg>
