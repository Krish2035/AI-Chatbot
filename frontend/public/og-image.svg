<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="grad1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="grad2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="20%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#06b6d4" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#090d16" />
  <rect width="1200" height="630" fill="url(#grad1)" />
  <rect width="1200" height="630" fill="url(#grad2)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Badge -->
  <g transform="translate(420, 100)">
    <rect width="360" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(6,182,212,0.4)" stroke-width="1.5" />
    <circle cx="28" cy="22" r="6" fill="#06b6d4" filter="url(#glow)" />
    <text x="46" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">NEUROCHAT AI • VERCEL EDITION</text>
  </g>

  <!-- Title -->
  <text x="600" y="240" text-anchor="middle" fill="url(#textGrad)" font-family="system-ui, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">AI Chatbot Vercel</text>

  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="24" font-weight="400">Ultra-Fast Next.js Chatbot with Persistent Vector Memory &amp; Groq LLM</text>

  <!-- Feature Pills -->
  <g transform="translate(180, 420)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="190" height="50" rx="16" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" />
      <text x="95" y="32" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="600">⚡ Groq LLaMA 3</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(210, 0)">
      <rect width="210" height="50" rx="16" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" />
      <text x="105" y="32" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">🧠 pgvector Memory</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(440, 0)">
      <rect width="200" height="50" rx="16" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" />
      <text x="100" y="32" text-anchor="middle" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="18" font-weight="600">▲ Next.js 14</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(660, 0)">
      <rect width="180" height="50" rx="16" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" />
      <text x="90" y="32" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="600">📱 Offline PWA</text>
    </g>
  </g>
</svg>

